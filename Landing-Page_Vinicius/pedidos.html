<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos — Que Tal Congelados</title>
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0;url=https://pedidos.quetalcongelados.com.br/?utm_source=landing&utm_medium=redirect&utm_campaign=pedidos" />
  <link rel="canonical" href="https://pedidos.quetalcongelados.com.br/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #7A0F14;
      color: #FAF6EE;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap {
      max-width: 480px;
    }
    .logo { height: 52px; width: auto; margin: 0 auto 32px; display: block; }
    h1 {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(250,246,238,.75);
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 28px;
      border-radius: 9999px;
      background: #DC8B1F;
      color: #1B1814;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: background 200ms ease-out;
    }
    .btn:hover { background: #B06E18; color: #FAF6EE; }
    .note {
      font-size: 12px;
      color: rgba(250,246,238,.4);
      margin-top: 20px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="assets/images/logos/logo-horizontal-dark.png"
         alt="Que Tal Congelados"
         width="200" height="52"
         class="logo" />
    <h1>Redirecionando para a plataforma de pedidos…</h1>
    <p>Em instantes você será levado ao nosso site de pedidos.<br>
       Caso não seja redirecionado automaticamente, clique abaixo.</p>
    <a href="https://pedidos.quetalcongelados.com.br/?utm_source=landing&utm_medium=redirect&utm_campaign=pedidos"
       class="btn">
      Ir para pedidos.quetalcongelados.com.br
    </a>
    <p class="note">Você será redirecionado em instantes.</p>
  </div>
  <script>
    setTimeout(function () {
      window.location.replace(
        'https://pedidos.quetalcongelados.com.br/?utm_source=landing&utm_medium=redirect&utm_campaign=pedidos'
      );
    }, 200);
  </script>
</body>
</html>
